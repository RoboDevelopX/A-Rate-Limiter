[project]
name = "mlratelimit"
version = "0.1.0"
description = "Async rate limiting for ML/LLM inference APIs: five algorithms, in-memory and Redis (Lua) backends, FastAPI integration."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ribhu", email = "96328721+RoboDevelopX@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "BLE", "S", "PT", "RET", "PL", "TRY", "N",
]
ignore = [
    "PLR2004",  # magic values are fine in tests and in algorithm constants
    "TRY003",   # long exception messages are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913", "S311"]
"bench/**" = ["S311", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "redis: needs a running Redis server (REDIS_URL)",
]

[tool.coverage.run]
source = ["mlratelimit"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]
